<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>signal detected</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Consolas',monospace;color:rgba(43,208,208,0.8)}
canvas#gl{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;z-index:0}
canvas#rCv{position:fixed;top:0;left:0;width:100vw;height:100vh;display:none;z-index:0}
canvas#pcv{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;pointer-events:none;z-index:1}
#vig{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.6) 100%)}
#rPanel{position:fixed;top:12px;right:12px;width:220px;z-index:12;display:none;background:rgba(0,0,0,0.85);border:1px solid rgba(255,80,50,0.3);padding:12px;font-size:11px;line-height:1.8}
#rPanel .rp-title{color:rgba(255,100,50,0.9);font-size:12px;border-bottom:1px solid rgba(255,80,50,0.2);padding-bottom:4px;margin-bottom:4px}
.rp-ok{color:rgba(80,255,80,0.8)}.rp-warn{color:rgba(255,255,50,0.8)}.rp-danger{color:rgba(255,80,50,0.9)}
#rTerminal{position:fixed;bottom:0;left:0;width:420px;height:35vh;z-index:12;display:none;background:rgba(10,8,4,0.95);padding:40px 16px 12px;flex-direction:column;font-size:12px;border-right:1px solid rgba(255,80,50,0.2)}
#rTerminal #rtOut{flex:1;overflow-y:auto;color:rgba(255,200,100,0.7);scrollbar-width:thin}
#rTerminal #rtRow{display:flex;align-items:center;padding-top:8px;border-top:1px solid rgba(255,80,50,0.15)}
#rTerminal #rtPmt{color:rgba(255,100,50,0.9);margin-right:8px;white-space:nowrap}
#rTerminal #rtIn{flex:1;background:transparent;border:none;outline:none;color:rgba(255,200,100,0.7);font-family:inherit;font-size:12px;caret-color:rgba(255,100,50,0.8)}
#navR{position:fixed;top:50%;right:12px;z-index:11;background:rgba(0,0,0,0.5);border:1px solid rgba(255,80,50,0.3);color:rgba(255,100,50,0.7);padding:8px 6px;cursor:pointer;font-size:14px;display:none}
#navL{position:fixed;top:50%;left:12px;z-index:11;background:rgba(0,0,0,0.5);border:1px solid rgba(43,208,208,0.3);color:rgba(43,208,208,0.7);padding:8px 6px;cursor:pointer;font-size:14px;display:none}
#guiLayer{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:8}
.gui-win{position:absolute;background:rgba(10,10,30,0.92);border:1px solid rgba(43,208,208,0.4);min-width:120px;min-height:60px;pointer-events:auto;cursor:default}
.gui-win.active{border-color:rgba(43,208,208,0.8);box-shadow:0 0 12px rgba(43,208,208,0.2)}
.gui-win .gui-title{background:rgba(43,208,208,0.15);padding:4px 8px;font-size:11px;color:rgba(43,208,208,0.8);cursor:move;display:flex;justify-content:space-between;align-items:center}
.gui-win .gui-title .gui-close{cursor:pointer;color:rgba(255,80,80,0.7);margin-left:8px}
.gui-win .gui-title .gui-close:hover{color:rgba(255,80,80,1)}
.gui-win .gui-body{padding:8px;position:relative;overflow:auto}
.gui-label{position:absolute;color:rgba(43,208,208,0.8);font-size:12px;white-space:nowrap}
.gui-btn{position:absolute;background:rgba(43,208,208,0.15);border:1px solid rgba(43,208,208,0.4);color:rgba(43,208,208,0.9);padding:4px 12px;cursor:pointer;font-family:inherit;font-size:11px}
.gui-btn:hover{background:rgba(43,208,208,0.25)}
.gui-input{position:absolute;background:rgba(0,0,0,0.5);border:1px solid rgba(43,208,208,0.3);color:rgba(43,208,208,0.8);padding:4px 8px;font-family:inherit;font-size:11px;outline:none}
.gui-check{position:absolute;color:rgba(43,208,208,0.7);font-size:11px;cursor:pointer}
#terminal{position:fixed;bottom:0;left:0;width:100%;height:35vh;z-index:10;background:linear-gradient(transparent,rgba(0,0,0,0.95) 20%);padding:40px 20px 12px;display:flex;flex-direction:column}
#tOut{flex:1;overflow-y:auto;font-size:13px;line-height:1.6;scrollbar-width:thin;scrollbar-color:rgba(43,208,208,0.3) transparent}
#tRow{display:flex;align-items:center;padding-top:8px;border-top:1px solid rgba(43,208,208,0.15)}
#tPmt{color:rgba(43,208,208,0.9);margin-right:8px;white-space:nowrap;font-size:13px}
#tIn{flex:1;background:transparent;border:none;outline:none;color:rgba(43,208,208,0.8);font-family:inherit;font-size:13px;caret-color:rgba(43,208,208,0.8)}
#stats{position:fixed;top:12px;left:12px;z-index:10;font-size:11px;color:rgba(255,255,255,0.3);pointer-events:none}
#thI{position:fixed;top:12px;right:12px;z-index:10;font-size:11px;color:rgba(43,208,208,0.4);pointer-events:none;opacity:0;transition:opacity 0.3s}
#objText{position:fixed;pointer-events:none;z-index:5;font-size:28px;color:rgba(43,208,208,0.85);text-shadow:0 0 20px rgba(43,208,208,0.4),0 0 40px rgba(43,208,208,0.2);opacity:0;transition:opacity 0.4s;font-family:'Consolas',monospace;letter-spacing:2px;text-align:center;padding:0 40px;max-width:60vw;line-height:1.4}
#objText.on{opacity:1}
#objText.shake{animation:objShake 0.08s infinite}
#objText.glitch{animation:objGlitch 0.15s infinite}
@keyframes objShake{0%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(-2px,1px) rotate(-0.5deg)}50%{transform:translate(2px,-1px) rotate(0.5deg)}75%{transform:translate(-1px,-2px) rotate(-0.3deg)}100%{transform:translate(1px,2px) rotate(0.3deg)}}
@keyframes objGlitch{0%{transform:translate(0,0);opacity:0.85}20%{transform:translate(-3px,2px);opacity:0.6}40%{transform:translate(3px,-2px);opacity:0.9}60%{transform:translate(-1px,-3px);opacity:0.5}80%{transform:translate(2px,1px);opacity:0.85}100%{transform:translate(0,0);opacity:0.85}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="rCv"></canvas>
<canvas id="pcv"></canvas>
<div id="vig"></div>
<div id="stats"></div>
<div id="thI"></div>
<div id="objText"></div>
<div id="navR">&#9654;</div>
<div id="navL">&#9664;</div>
<div id="guiLayer"></div>
<div id="rPanel"><div class="rp-title">REACTOR STATUS</div><div id="rPanelBody"></div></div>
<div id="rTerminal"><div id="rtOut"></div><div id="rtRow"><span id="rtPmt">reactor#&gt;</span><input id="rtIn" type="text" spellcheck="false" autocomplete="off"></div></div>
<div id="terminal">
  <div id="tOut"></div>
  <div id="tRow">
    <span id="tPmt">obj://&gt;</span>
    <input id="tIn" type="text" spellcheck="false" autocomplete="off" autofocus>
  </div>
</div>
<audio id="drone" loop preload="auto"><source src="void_drone.webm" type="audio/webm"></audio>
<script>
(function(){
"use strict";

var tOut=document.getElementById("tOut");
var tIn=document.getElementById("tIn");
var thI=document.getElementById("thI");
var statsEl=document.getElementById("stats");
var curTheme=1,curShape=0,particleCount=150,bootDone=false,t0=Date.now(),hist=[],histIdx=-1;
var lastFps=60;

var themes={1:{p:[43,208,208],n:"void"},2:{p:[255,50,50],n:"blood"},3:{p:[100,200,255],n:"ice"},4:{p:[50,255,100],n:"toxic"},5:{p:[200,100,255],n:"void alt"}};
function tc(a){var c=themes[curTheme].p;return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"}
function tp(txt,col){var d=document.createElement("div");if(col)d.style.color=col;d.textContent=txt;tOut.appendChild(d);tOut.scrollTop=tOut.scrollHeight}
function showThI(name){thI.textContent="theme: "+name;thI.style.opacity="1";setTimeout(function(){thI.style.opacity="0"},2000)}

// AUDIO
var drone=document.getElementById("drone");drone.volume=0.25;var audioOn=false;
function startAudio(){if(audioOn)return;audioOn=true;drone.play().catch(function(){})}
document.addEventListener("click",startAudio);document.addEventListener("keydown",startAudio);setTimeout(startAudio,3500);

// VIRTUAL FILESYSTEM
var fs={"/":{t:"d",c:["home","etc","void","dev"]},
"/home":{t:"d",c:["intruder"]},
"/home/intruder":{t:"d",c:["notes.txt","signal.log"]},
"/home/intruder/notes.txt":{t:"f",v:"you are not supposed to be here.\nthe void remembers every visitor.\nbut you... you are different."},
"/home/intruder/signal.log":{t:"f",v:"[00:00] signal detected\n[00:01] connection established\n[00:02] intruder identified\n[00:03] the cube is watching"},
"/etc":{t:"d",c:["hostname","blacklist","void.conf"]},
"/etc/hostname":{t:"f",v:"objbox"},
"/etc/blacklist":{t:"f",v:"nyarch\njbo\nevil_lux\nthe_old_cube"},
"/etc/void.conf":{t:"f",v:"# void configuration\nmax_intruders=1\nallow_nyarch=false\ncube_integrity=100\nfresnel_strength=0.8"},
"/void":{t:"d",c:["manifesto.txt","echo","entropy"]},
"/void/manifesto.txt":{t:"f",v:"the void is not empty.\nit is full of things you cannot see.\nthe cube is a window.\nyou are looking through it.\nbut what is looking back?"},
"/void/echo":{t:"f",v:"the void echoes your words back as questions.\nwho are you?\nwhy are you here?\ndo you think you chose to open this tab?"},
"/void/entropy":{t:"f",v:"package: entropy\nversion: 1.0.0\ndescription: increases chaos in the system\neffect: modulates cube time with sine wave\nstatus: installed"},
"/dev":{t:"d",c:["null","random","gl"]},
"/dev/null":{t:"f",v:""},
"/dev/random":{t:"f",v:"01001000 01100101 01101100 01101100 01101111 00100000 01010111 01101111 01110010 01101100 01100100"},
"/dev/gl":{t:"f",v:"webgl: available\ncanvas: active\nshaders: compiled\nfresnel: enabled\nparticles: active"}};
var cwd="/home/intruder";

function fsResolve(p){if(p==="/")return"/";var pts=p.replace(/^\//,"").replace(/\/$/,"").split("/"),r=[];for(var i=0;i<pts.length;i++){if(pts[i]===".."){if(r.length)r.pop()}else if(pts[i]!==".")r.push(pts[i])}return"/"+r.join("/")}
function fsGet(p){var r=fsResolve(p);return r==="/"?fs["/"]:fs[r]||null}
function fsParent(p){var pts=fsResolve(p).split("/");pts.pop();return pts.join("/")||"/"}
function fsMkdir(p){var r=fsResolve(p);if(fs[r])return"already exists";var par=fsParent(r),nm=r.split("/").pop();if(!fs[par]||fs[par].t!=="d")return"parent not found";fs[par].c.push(nm);fs[r]={t:"d",c:[]};return"ok"}
function fsTouch(p){var r=fsResolve(p);if(fs[r])return"ok";var par=fsParent(r),nm=r.split("/").pop();if(!fs[par]||fs[par].t!=="d")return"parent not found";fs[par].c.push(nm);fs[r]={t:"f",v:""};return"ok"}
function fsWrite(p,v){var r=fsResolve(p);if(!fs[r]){var x=fsTouch(p);if(x!=="ok")return x}fs[r].t="f";fs[r].v=v;return"ok"}
function fsRm(p){var r=fsResolve(p);if(!fs[r])return"not found";if(r==="/")return"cannot delete /";var par=fsParent(r),nm=r.split("/").pop();if(fs[par]&&fs[par].c){var i=fs[par].c.indexOf(nm);if(i!==-1)fs[par].c.splice(i,1)}delete fs[r];for(var k in fs)if(k.indexOf(r+"/")===0)delete fs[k];return"ok"}
function fsLs(p){var n=fsGet(p||cwd);if(!n||n.t!=="d")return null;return n.c||[]}

// VOID PACKAGES
var packages={
interloper:{name:"interloper",v:"1.0",desc:"opens a window into the void",effect:"adds interloper transmission to obj whispers"},
paranoia:{name:"paranoia",v:"1.2",desc:"the void watches you more closely",effect:"increases obj whisper frequency by 2x"},
entropy:{name:"entropy",v:"1.0",desc:"increases chaos in the system",effect:"modulates cube time variable with sine wave"},
voidscript:{name:"voidscript",v:"2.0",desc:"enables the voidscript language",effect:"allows running scripts in the void"},
doom:{name:"doom",v:"0.666",desc:"you should not have installed this",effect:"???"},
interloper2:{name:"interloper2",v:"2.0",desc:"interloper but louder",effect:"doubles interloper frequency"},
}
var installed={entropy:true};

function voidList(){var out=[];for(var k in packages){var p=packages[k];out.push((installed[k]?"[installed] ":"  ")+p.name+" v"+p.v+" — "+p.desc)}return out}
function voidSearch(q){var out=[];for(var k in packages){var p=packages[k];if(k.indexOf(q)!==-1||p.desc.indexOf(q)!==-1)out.push("  "+p.name+" v"+p.v+" — "+p.desc)}return out}

// VARS for voidscript
var vars={};

// TERMINAL INPUT
tIn.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    var raw=tIn.value.trim();tIn.value="";
    if(!raw)return;
    tp("obj://> "+raw,"rgba(255,255,255,0.5)");
    hist.push(raw);histIdx=hist.length;
    try{runCmd(raw)}catch(err){tp("error: "+err.message,"rgba(255,80,80,0.8)")}
  } else if(e.key==="ArrowUp"){e.preventDefault();if(histIdx>0){histIdx--;tIn.value=hist[histIdx]}}
  else if(e.key==="ArrowDown"){e.preventDefault();if(histIdx<hist.length-1){histIdx++;tIn.value=hist[histIdx]}else{histIdx=hist.length;tIn.value=""}}
});

function runCmd(raw){
  var parts=raw.split(/\s+/);var cmd=parts[0].toLowerCase();var args=parts.slice(1);

  if(cmd==="help"){
    tp("--- OBJBOX II ---",tc(0.9));tp("");
    tp(" CORE: help, clear, echo, reboot, manifesto, uptime, fps");
    tp(" DISPLAY: vibe <1-5>, morph <name>, dust <n>");
    tp(" AUDIO: drone <on|off>");
    tp(" VOID: shout <who> <msg>, whoami, scan");
    tp(" FILESYSTEM: pwd, ls, cd, cat, mkdir, touch, rm, tree");
    tp(" PACKAGES: void intrude/remove/list/search");
    tp(" SCRIPTING: studio or run <code>");
    tp(" GUI: gui window/label/button/input/check/close/clear");
    tp(" REACTOR: reactor (F3)");
    tp("");
  } else if(cmd==="clear"){tOut.innerHTML=""}
  else if(cmd==="echo"){tp(args.join(" "),"rgba(255,255,255,0.5)")}
  else if(cmd==="vibe"||cmd==="theme"){var t=parseInt(args[0]);if(t>=1&&t<=5){curTheme=t;tIn.style.color=tc(0.8);tIn.style.caretColor=tc(0.8);tp("vibe: "+themes[t].n,tc(0.7));showThI(themes[t].n)}else tp("usage: vibe <1-5>","rgba(255,80,80,0.8)")}
  else if(cmd==="morph"||cmd==="shape"){var s=(args[0]||"").toLowerCase();if(s==="cube"){curShape=0;tp("morph: cube",tc(0.7))}else if(s==="sphere"){curShape=1;tp("morph: sphere",tc(0.7))}else tp("morph: cube, sphere","rgba(255,255,255,0.4)")}
  else if(cmd==="dust"||cmd==="particles"){particleCount=parseInt(args[0])||150;initP();tp("dust: "+particleCount,tc(0.7))}
  else if(cmd==="shout"||cmd==="transmit"){
    var who=(args[0]||"").replace(/"/g,""),msg=args.slice(1).join(" ").replace(/"/g,"");
    if(!who||!msg){tp("usage: shout <who> <message>","rgba(255,80,80,0.8)");return}
    tp(who+": "+msg,"rgba(255,255,255,0.5)");
    if(Math.random()<0.12){var zm=["yo thats crazy but also the egg survives.","sup gang, zen was here.","ngl this void go hard.","yo obj aint even here.","ayy my egg ahh just vibin."];tp("zen: "+zm[Math.floor(Math.random()*zm.length)],"rgba(255,230,0,1)")}
    else{var rs=["the void hears you.","acknowledged.","signal received.","the cube has noted your transmission.","your words echo through nothing."];tp("obj: "+rs[Math.floor(Math.random()*rs.length)],tc(0.6))}
  }
  else if(cmd==="whoami"){tp("you are the intruder.",tc(0.7));tp("you opened the tab. you are here now.","rgba(255,255,255,0.3)")}
  else if(cmd==="scan"){
    tp("--- VOID SCAN ---",tc(0.9));
    tp("webgl: "+(gl?"active":"inactive"),gl?"rgba(80,255,80,0.7)":"rgba(255,80,80,0.7)");
    tp("particles: "+particleCount,tc(0.6));
    tp("theme: "+themes[curTheme].n,tc(0.6));
    tp("shape: "+["cube","sphere"][curShape],tc(0.6));
    tp("cwd: "+cwd,tc(0.6));
    tp("uptime: "+Math.floor((Date.now()-t0)/1000)+"s",tc(0.6));
    tp("view: "+currentView,tc(0.6));
    var pkgCount=0;for(var k in installed)if(installed[k])pkgCount++;
    tp("packages: "+pkgCount+" installed",tc(0.6));
  }
  else if(cmd==="uptime"){var el=Math.floor((Date.now()-t0)/1000),h=Math.floor(el/3600),m=Math.floor((el%3600)/60),s=el%60;tp("uptime: "+h+"h "+m+"m "+s+"s",tc(0.6))}
  else if(cmd==="fps"){tp("fps: "+lastFps,tc(0.6))}
  else if(cmd==="drone"||cmd==="bgm"){var st=(args[0]||"").toLowerCase();if(st==="on"){drone.volume=0.25;startAudio();tp("drone: on (0.25)",tc(0.6))}else if(st==="off"){drone.volume=0;tp("drone: off",tc(0.6))}else tp("usage: drone <on|off>","rgba(255,80,80,0.8)")}
  else if(cmd==="reboot"||cmd==="reload"){tp("rebooting...","rgba(255,200,50,0.8)");setTimeout(function(){location.reload()},1000)}
  else if(cmd==="manifesto"||cmd==="about"){
    tp("objbox ii",tc(0.9));tp("");
    tp("rebuilt from the ashes of the old void.","rgba(255,255,255,0.4)");
    tp("the corruption was not a bug. it was a feature.","rgba(255,255,255,0.3)");
    tp("the encoding was not broken. it was a language.","rgba(255,255,255,0.3)");
    tp("this is objbox. obj lives here.","rgba(255,255,255,0.3)");tp("");
  }
  else if(cmd==="reactor"){tp("entering reactor...","rgba(255,100,50,0.7)");setTimeout(function(){switchView("reactor")},500)}
  else if(cmd==="studio"){tp("opening voidstudio...","rgba(200,100,255,0.7)");setTimeout(openStudio,300)}

  // FILESYSTEM
  else if(cmd==="pwd"){tp(cwd,tc(0.6))}
  else if(cmd==="ls"){
    var target=args[0]||cwd;var items=fsLs(target);
    if(!items){tp("not found: "+target,"rgba(255,80,80,0.6)")}
    else if(items.length===0){tp("(empty)","rgba(255,255,255,0.3)")}
    else{var out="";for(var i=0;i<items.length;i++){var full=fsResolve(target==="/"?"":"/"+items[i]);var node=fs[full];out+=node&&node.t==="d"?items[i]+"/  ":items[i]+"  "}tp(out.trim(),tc(0.7))}
  }
  else if(cmd==="cd"){
    var target=args[0]||"/";
    if(target==="~")target="/home/intruder";
    var r=fsResolve(target);
    var node=fsGet(r);
    if(!node||node.t!=="d"){tp("not a directory: "+target,"rgba(255,80,80,0.6)")}
    else{cwd=r}
  }
  else if(cmd==="cat"){
    var target=args[0];if(!target){tp("usage: cat <path>","rgba(255,80,80,0.8)");return}
    var r=fsResolve(target);var node=fsGet(r);
    if(!node){tp("not found: "+target,"rgba(255,80,80,0.6)")}
    else if(node.t==="d"){tp(target+": is a directory","rgba(255,80,80,0.6)")}
    else{var lines=(node.v||"").split("\n");for(var i=0;i<lines.length;i++)tp(lines[i],"rgba(255,255,255,0.7)")}
  }
  else if(cmd==="mkdir"){
    var target=args[0];if(!target){tp("usage: mkdir <path>","rgba(255,80,80,0.8)");return}
    var res=fsMkdir(target);tp(res,tc(0.6));
  }
  else if(cmd==="touch"){
    var target=args[0];if(!target){tp("usage: touch <path>","rgba(255,80,80,0.8)");return}
    var res=fsTouch(target);tp(res,tc(0.6));
  }
  else if(cmd==="echo"){
    if(raw.indexOf(">")!==-1){
      var arrowIdx=raw.indexOf(">");var left=raw.substring(4,arrowIdx).trim();var right=raw.substring(arrowIdx+1).trim();
      var res=fsWrite(left,right);tp(res,tc(0.6));
    } else {tp(args.join(" "),"rgba(255,255,255,0.5)")}
  }
  else if(cmd==="rm"){
    var target=args[0];if(!target){tp("usage: rm <path>","rgba(255,80,80,0.8)");return}
    var res=fsRm(target);tp(res,tc(0.6));
  }
  else if(cmd==="tree"){
    var target=args[0]||cwd;
    function treeWalk(p,indent){
      var n=fsGet(p);if(!n)return;
      var name=p==="/"?"/":p.split("/").pop();
      if(n.t==="d"){tp(indent+name+"/",tc(0.7));if(n.c)for(var i=0;i<n.c.length;i++)treeWalk(fsResolve(p==="/"?"":"/"+n.c[i]),indent+"  ")}
      else{tp(indent+name,"rgba(255,255,255,0.5)")}
    }
    treeWalk(target,"");
  }

  // VOID PACKAGE MANAGER
  else if(cmd==="void"){
    var sub=(args[0]||"").toLowerCase();
    if(sub==="list"||sub==="ls"){
      var lines=voidList();for(var i=0;i<lines.length;i++)tp(lines[i],installed[packages[lines[i].trim().split(" ")[1]]?lines[i].trim().split(" ")[1]:""]?tc(0.7):"rgba(255,255,255,0.4)");
      var count=0;for(var k in installed)if(installed[k])count++;
      tp("("+count+" installed)","rgba(255,255,255,0.3)");
    } else if(sub==="search"||sub==="find"){
      var q=(args[1]||"").toLowerCase();if(!q){tp("usage: void search <query>","rgba(255,80,80,0.8)");return}
      var results=voidSearch(q);if(results.length===0)tp("no packages found","rgba(255,255,255,0.3)");

    else if(sub==="close")guiClearAll();
  }

}

function switchView(v){currentView=v;if(v==="reactor"){glCanvas.style.display="none";pcv.style.display="none";document.getElementById("vig").style.display="none";terminal.style.display="none";navR.style.display="none";navL.style.display="block";rCv.style.display="block";rPanel.style.display="block";rTerm.style.display="flex";initReactorGL();rPrint("reactor online. type \"help\".","rgba(255,100,50,0.7)");document.getElementById("rtIn").focus()}else{rCv.style.display="none";rPanel.style.display="none";rTerm.style.display="none";navL.style.display="none";navR.style.display="block";glCanvas.style.display="block";pcv.style.display="block";document.getElementById("vig").style.display="block";terminal.style.display="flex";tIn.focus()}}

// REACTOR
var R={temp:280,pressure:14.5,power:15,rodPos:30,coolantOn:false,xenon:2,iodine:3,flux:0.5,scramActive:false,scramTimer:0,running:true,history:[],lastTick:Date.now(),ambientTemp:25};
function rLog(msg){R.history.push("["+new Date().toLocaleTimeString()+"] "+msg);if(R.history.length>100)R.history.shift()}
function rPrint(txt,col){var d=document.createElement("div");if(col)d.style.color=col;d.textContent=txt;var o=document.getElementById("rtOut");o.appendChild(d);o.scrollTop=o.scrollHeight}
var rtIn=document.getElementById("rtIn");var rHist=[],rHistIdx=-1;
rtIn.addEventListener("keydown",function(e){e.stopPropagation();if(e.key==="Enter"){var raw=rtIn.value.trim();rtIn.value="";if(!raw)return;rPrint("reactor#> "+raw,"rgba(255,255,255,0.4)");rHist.push(raw);rHistIdx=rHist.length;try{evalRCmd(raw)}catch(err){rPrint("error: "+err.message,"rgba(255,80,80,0.8)")}}else if(e.key==="ArrowUp"){e.preventDefault();if(rHistIdx>0){rHistIdx--;rtIn.value=rHist[rHistIdx]}}else if(e.key==="ArrowDown"){e.preventDefault();if(rHistIdx<rHist.length-1){rHistIdx++;rtIn.value=rHist[rHistIdx]}else{rHistIdx=rHist.length;rtIn.value=""}}});

function reactorTick(){if(!R.running)return;var now=Date.now(),dt=(now-R.lastTick)/1000;R.lastTick=now;if(R.scramActive){R.rodPos=Math.max(0,R.rodPos-50*dt);R.scramTimer+=dt;if(R.rodPos<=0){R.scramActive=false;rPrint("[SCRAM] rods fully inserted","rgba(255,200,50,0.8)")}}var rodR=(R.rodPos/100)*0.05,xenonR=R.xenon*0.002,totalR=rodR-xenonR,beta=0.0065,lam=0.08,pl=0.0001,dk=totalR-beta;R.flux=R.flux*Math.exp(dk/pl*dt)+lam*R.iodine*dt;R.flux=Math.max(0,Math.min(3,R.flux));R.power=R.flux*30;R.power=Math.max(0,Math.min(300,R.power));var cc=R.coolantOn?1.5:0;R.temp+=R.power*8.5*dt-cc*(R.temp-R.ambientTemp)*dt;R.temp=Math.max(R.ambientTemp,Math.min(3000,R.temp));var tp2=14.5+(R.temp-300)*0.008;R.pressure+=(tp2-R.pressure)*0.5*dt;R.pressure=Math.max(10,Math.min(30,R.pressure));R.iodine+=R.power*0.01*dt;R.xenon+=R.iodine*0.005*dt-R.flux*R.xenon*0.001*dt;R.iodine*=0.999;R.xenon=Math.max(0,Math.min(100,R.xenon));if(R.temp>=2500){rLog("MELTDOWN");rPrint("CONTAINMENT FAILURE","rgba(255,50,50,1)");R.running=false}if(R.pressure>=25){rLog("OVERPRESSURE");R.pressure-=0.5}updateRPanel()}
setInterval(reactorTick,50);

function evalRCmd(raw){var p=raw.split(/\s+/),c=p[0].toLowerCase(),a=p.slice(1);
if(c==="help"){rPrint("--- REACTOR ---","rgba(255,100,50,0.9)");rPrint("status,temp,pressure,power,rod,coolant,az5,flux,xenon,iodine,history,reset,nyarch")}
else if(c==="status"){rPrint("TEMP: "+R.temp.toFixed(1)+" C",R.temp>=2000?"rgba(255,80,50,0.9)":R.temp>=1000?"rgba(255,255,50,0.8)":"rgba(80,255,80,0.8)");rPrint("PRESSURE: "+R.pressure.toFixed(1)+" MPa",R.pressure>=22?"rgba(255,80,50,0.9)":"rgba(80,255,80,0.8)");rPrint("POWER: "+R.power.toFixed(1)+"%",R.power>=120?"rgba(255,255,50,0.8)":"rgba(80,255,80,0.8)");rPrint("RODS: "+R.rodPos.toFixed(0)+"%");rPrint("COOLANT: "+(R.coolantOn?"ON":"OFF"),R.coolantOn?"rgba(80,150,255,0.8)":"rgba(255,80,50,0.6)");rPrint("FLUX: "+R.flux.toFixed(4));rPrint("XENON: "+R.xenon.toFixed(2))}
else if(c==="temp"){rPrint("temp: "+R.temp.toFixed(1)+" C",R.temp>=2000?"rgba(255,80,50,0.9)":"rgba(80,255,80,0.8)")}
else if(c==="pressure"||c==="pres"){rPrint("pressure: "+R.pressure.toFixed(1)+" MPa",R.pressure>=22?"rgba(255,80,50,0.9)":"rgba(80,255,80,0.8)")}
else if(c==="power"){rPrint("power: "+R.power.toFixed(1)+"%")}
else if(c==="rod"){if(a[0]!==undefined){R.rodPos=Math.max(0,Math.min(100,parseInt(a[0])||0));rLog("rods: "+R.rodPos+"%");rPrint("rods: "+R.rodPos+"%","rgba(80,255,80,0.8)")}else rPrint("rods: "+R.rodPos.toFixed(0)+"%")}
else if(c==="coolant"){var s=(a[0]||"").toLowerCase();if(s==="on"){R.coolantOn=true;rPrint("coolant: ON","rgba(80,150,255,0.8)")}else if(s==="off"){R.coolantOn=false;rPrint("coolant: OFF","rgba(255,80,50,0.6)")}else rPrint("coolant: "+(R.coolantOn?"ON":"OFF"))}
else if(c==="az5"||c==="scram"){R.scramActive=true;R.scramTimer=0;rPrint("[SCRAM] emergency shutdown","rgba(255,200,50,0.9)")}
else if(c==="flux"){rPrint("flux: "+R.flux.toFixed(4))}
else if(c==="xenon"){rPrint("xenon: "+R.xenon.toFixed(2))}
else if(c==="iodine"){rPrint("iodine: "+R.iodine.toFixed(2))}
else if(c==="history"){var s=Math.max(0,R.history.length-20);for(var i=s;i<R.history.length;i++)rPrint(R.history[i],"rgba(255,200,100,0.5)")}
else if(c==="reset"){R.temp=280;R.pressure=14.5;R.power=15;R.rodPos=30;R.coolantOn=false;R.xenon=2;R.iodine=3;R.flux=0.5;R.scramActive=false;R.running=true;R.lastTick=Date.now();rPrint("reset","rgba(80,255,80,0.8)")}
else if(c==="nyarch"){rPrint("jbo: NYARCH DETECTED","rgba(255,50,50,1)");rPrint("jbo: GET OUT","rgba(255,50,50,1)");rPrint("jbo: NOW","rgba(255,50,50,1)")}
else rPrint("unknown: "+c,"rgba(255,80,80,0.6)")}

function updateRPanel(){var b=document.getElementById("rPanelBody");b.innerHTML="";var lines=[["TEMP",R.temp.toFixed(1)+" C",R.temp>=2000?"rp-danger":R.temp>=1000?"rp-warn":"rp-ok"],["PRESSURE",R.pressure.toFixed(1)+" MPa",R.pressure>=22?"rp-danger":"rp-ok"],["POWER",R.power.toFixed(1)+"%",R.power>=120?"rp-danger":"rp-ok"],["RODS",R.rodPos.toFixed(0)+"%","rp-ok"],["COOLANT",R.coolantOn?"ON":"OFF",R.coolantOn?"rp-ok":"rp-danger"],["XENON",R.xenon.toFixed(2),R.xenon>50?"rp-warn":"rp-ok"],["SIM",R.running?"ACTIVE":"STOPPED",R.running?"rp-ok":"rp-danger"]];for(var i=0;i<lines.length;i++){var l=lines[i],d=document.createElement("div");d.innerHTML="<span class='"+l[2]+"'>"+l[0]+": "+l[1]+"</span>";b.appendChild(d)}}

var rCtx=rCv.getContext("2d"),rParticles=[];
function initReactorGL(){rCv.width=window.innerWidth;rCv.height=window.innerHeight;rParticles=[];for(var i=0;i<40;i++)rParticles.push({x:rCv.width*0.5+(Math.random()-0.5)*100,y:rCv.height*0.5+(Math.random()-0.5)*100,vx:(Math.random()-0.5)*0.5,vy:-Math.random()*1.5-0.5,a:Math.random()*0.5+0.2,life:Math.random()})}
function renderReactor(){if(currentView!=="reactor")return;var W=rCv.width,H=rCv.height;rCtx.fillStyle="rgba(0,0,0,0.15)";rCtx.fillRect(0,0,W,H);var cx=W*0.55,cy=H*0.5,tf=Math.min(1,R.temp/2500);var cr=Math.floor(50+tf*205),cg=Math.floor(200-tf*150),cb=Math.floor(50-tf*50);rCtx.fillStyle="rgba("+cr+","+cg+","+cb+",0.12)";rCtx.beginPath();rCtx.arc(cx,cy,80+tf*40,0,Math.PI*2);rCtx.fill();rCtx.fillStyle="rgba("+cr+","+cg+","+cb+",0.06)";rCtx.beginPath();rCtx.arc(cx,cy,120+tf*60,0,Math.PI*2);rCtx.fill();for(var i=0;i<8;i++){var a=(i/8)*Math.PI*2,rx=cx+Math.cos(a)*50,ry=cy+Math.sin(a)*50,rh=30*(R.rodPos/100);rCtx.fillStyle="rgba(180,180,200,0.6)";rCtx.fillRect(rx-2,ry-15,4,30);rCtx.fillStyle=tf>0.5?"rgba(255,"+Math.floor(200-tf*150)+",50,0.8)":"rgba(200,180,50,0.7)";rCtx.fillRect(rx-2,ry-15,4,rh)}if(R.coolantOn){rCtx.fillStyle="rgba(50,100,255,0.15)";rCtx.beginPath();rCtx.arc(cx,cy,100,0,Math.PI*2);rCtx.fill()}for(var j=0;j<rParticles.length;j++){var pp=rParticles[j];pp.x+=pp.vx;pp.y+=pp.vy;pp.life+=0.01;if(pp.life>1||pp.y<0){pp.x=cx+(Math.random()-0.5)*80;pp.y=cy+30;pp.life=0;pp.vy=-Math.random()*1.5-0.5}rCtx.fillStyle="rgba(200,220,255,"+pp.a*(1-pp.life)+")";rCtx.beginPath();rCtx.arc(pp.x,pp.y,1.5,0,Math.PI*2);rCtx.fill()}requestAnimationFrame(renderReactor)}

// GUI
var guiLayer=document.getElementById("guiLayer"),guiWins={},guiActiveId=null,guiNextId=1;
function guiCreateWin(title,x,y,w,h){var id="gw"+(guiNextId++),el=document.createElement("div");el.className="gui-win active";el.style.left=(x||100)+"px";el.style.top=(y||100)+"px";el.style.width=(w||200)+"px";el.style.height=(h||150)+"px";el.innerHTML="<div class='gui-title'><span>"+title+"</span><span class='gui-close'>&times;</span></div><div class='gui-body' id='"+id+"_body'></div>";guiLayer.appendChild(el);guiWins[id]={el:el,body:el.querySelector(".gui-body"),title:title};guiMakeDraggable(el,el.querySelector(".gui-title"));el.addEventListener("mousedown",function(){guiFocus(id)});el.querySelector(".gui-close").addEventListener("click",function(){guiDestroy(id)});guiFocus(id);return id}
function guiMakeDraggable(el,handle){var ox,oy,sx,sy;handle.addEventListener("mousedown",function(e){e.preventDefault();sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;function onM(ev){el.style.left=ox+(ev.clientX-sx)+"px";el.style.top=oy+(ev.clientY-sy)+"px"}function onU(){document.removeEventListener("mousemove",onM);document.removeEventListener("mouseup",onU)}document.addEventListener("mousemove",onM);document.addEventListener("mouseup",onU)})}
function guiFocus(id){if(guiActiveId&&guiWins[guiActiveId])guiWins[guiActiveId].el.classList.remove("active");guiActiveId=id;if(guiWins[id])guiWins[id].el.classList.add("active")}
function guiDestroy(id){if(guiWins[id]){guiWins[id].el.remove();delete guiWins[id];if(guiActiveId===id)guiActiveId=null}}
function guiClearAll(){for(var id in guiWins)guiWins[id].el.remove();guiWins={};guiActiveId=null}
function guiAddLabel(t,x,y){if(!guiActiveId||!guiWins[guiActiveId])return;var el=document.createElement("div");el.className="gui-label";el.textContent=t;el.style.left=x+"px";el.style.top=y+"px";guiWins[guiActiveId].body.appendChild(el)}
function guiAddButton(t,x,y,cmd){if(!guiActiveId||!guiWins[guiActiveId])return;var el=document.createElement("button");el.className="gui-btn";el.textContent=t;el.style.left=x+"px";el.style.top=y+"px";el.addEventListener("click",function(){if(cmd)try{runCmd(cmd)}catch(e){}});guiWins[guiActiveId].body.appendChild(el)}
function guiAddInput(p,x,y,cmd){if(!guiActiveId||!guiWins[guiActiveId])return;var el=document.createElement("input");el.className="gui-input";el.type="text";el.placeholder=p||"";el.style.left=x+"px";el.style.top=y+"px";if(cmd)el.addEventListener("change",function(){var c=cmd.replace(/\$val/g,el.value);try{runCmd(c)}catch(e){}});guiWins[guiActiveId].body.appendChild(el)}
function guiAddCheck(l,x,y,cmd){if(!guiActiveId||!guiWins[guiActiveId])return;var el=document.createElement("label");el.className="gui-check";var cb=document.createElement("input");cb.type="checkbox";el.appendChild(cb);el.appendChild(document.createTextNode(" "+l));el.style.left=x+"px";el.style.top=y+"px";if(cmd)cb.addEventListener("change",function(){var c=cmd.replace(/\$val/g,cb.checked);try{runCmd(c)}catch(e){}});guiWins[guiActiveId].body.appendChild(el)}

// STUDIO
var studioOpen=false;
function openStudio(){if(studioOpen)return;studioOpen=true;if(currentView!=="void")switchView("void");
var ov=document.createElement("div");ov.id="studio";ov.style.cssText="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:50;background:#0a0a1a;display:flex;flex-direction:column";
ov.innerHTML="<div style='display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(43,208,208,0.08);border-bottom:1px solid rgba(43,208,208,0.2)'><span style='color:rgba(43,208,208,0.9);font-size:13px'>VOIDSCRIPT STUDIO</span><div><button id='stRun' style='background:rgba(80,255,80,0.15);border:1px solid rgba(80,255,80,0.4);color:rgba(80,255,80,0.9);padding:4px 12px;margin:0 4px;cursor:pointer;font-family:inherit;font-size:11px'>RUN (Ctrl+Enter)</button><button id='stStop' style='background:rgba(255,80,80,0.15);border:1px solid rgba(255,80,80,0.4);color:rgba(255,80,80,0.9);padding:4px 12px;margin:0 4px;cursor:pointer;font-family:inherit;font-size:11px'>STOP</button><button id='stExit' style='background:rgba(255,200,50,0.15);border:1px solid rgba(255,200,50,0.4);color:rgba(255,200,50,0.9);padding:4px 12px;margin:0 4px;cursor:pointer;font-family:inherit;font-size:11px'>EXIT</button></div></div><div style='flex:1;display:flex;overflow:hidden'><div style='flex:1;display:flex;flex-direction:column;border-right:1px solid rgba(43,208,208,0.15)'><div style='padding:4px 12px;font-size:11px;color:rgba(43,208,208,0.5)'>EDITOR</div><textarea id='stCode' style='flex:1;background:rgba(0,0,0,0.6);border:none;color:rgba(43,208,208,0.85);padding:12px;font-family:Consolas,monospace;font-size:13px;resize:none;outline:none;line-height:1.6' spellcheck='false'></textarea></div><div style='width:45%;display:flex;flex-direction:column'><div style='padding:4px 12px;font-size:11px;color:rgba(43,208,208,0.5)'>OUTPUT</div><div id='stOutput' style='flex:1;overflow-y:auto;padding:8px 12px;font-size:12px;color:rgba(43,208,208,0.7)'></div></div></div>";
document.body.appendChild(ov);
var code=document.getElementById("stCode"),out=document.getElementById("stOutput");var saved=localStorage.getItem("objbox_studio_autosave");if(saved)code.value=saved;code.addEventListener("input",function(){localStorage.setItem("objbox_studio_autosave",code.value)});
document.getElementById("stRun").addEventListener("click",function(){out.innerHTML="";var lines=code.value.split("\n");for(var i=0;i<lines.length;i++){var l=lines[i].trim();if(!l||l.startsWith("//"))continue;try{runVoidScriptLine(l)}catch(e){}}var d=document.createElement("div");d.textContent="[done]";d.style.color="rgba(80,255,80,0.5)";out.appendChild(d)});
document.getElementById("stStop").addEventListener("click",function(){guiClearAll();out.innerHTML=""});
document.getElementById("stExit").addEventListener("click",function(){document.getElementById("studio").remove();studioOpen=false});
code.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.ctrlKey){e.preventDefault();document.getElementById("stRun").click()}if(e.key==="s"&&e.ctrlKey){e.preventDefault();localStorage.setItem("objbox_studio_autosave",code.value)}if(e.key==="Escape"){document.getElementById("stExit").click()}})}

// BOOT
setTimeout(function(){tp("objbox ii initializing...","rgba(255,200,50,0.5)")},500);
setTimeout(function(){tp("the void has been rebuilt.",tc(0.6))},1500);
setTimeout(function(){tp("obj is online.",tc(0.8));tp("type \"help\". press 1-5 for vibe. F3 for reactor.","rgba(255,255,255,0.2)");tp("");bootDone=true;tIn.focus()},3000);

initP();render();
})();
</script>
